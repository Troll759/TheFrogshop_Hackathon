<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Germany Immigration Guide — Chat Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <div class="header-left">
                <div class="avatar">🇩🇪</div>
                <div class="header-info">
                    <h1 id="header-title">Germany Immigration Assistant</h1>
                    <p id="header-subtitle">I'll help you find the right documents</p>
                </div>
            </div>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="en" title="English">EN</button>
                <button class="lang-btn" data-lang="de" title="Deutsch">DE</button>
                <button class="lang-btn" data-lang="uk" title="Українська">UA</button>
                <button class="lang-btn" data-lang="ar" title="العربية">AR</button>
            </div>
        </header>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input-area" id="input-area"></div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
