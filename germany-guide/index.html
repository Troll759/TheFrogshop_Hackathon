<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Germany Immigration Guide</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="lang-bar">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="de">DE</button>
        <button class="lang-btn" data-lang="uk">UA</button>
        <button class="lang-btn" data-lang="ar">AR</button>
    </div>

    <main class="hero">
        <div class="hero-content">
            <h1 id="hero-title">🇩🇪 What do you need help with?</h1>
            <p id="hero-subtitle">Type your situation and we'll show you exactly which documents you need</p>

            <div class="search-wrapper">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" autocomplete="off" spellcheck="false">
                    <button class="clear-btn hidden" id="clear-btn">✕</button>
                </div>
                <div class="suggestions" id="suggestions"></div>
            </div>

            <div class="quick-tags" id="quick-tags"></div>
        </div>
    </main>

    <div class="result-panel hidden" id="result-panel">
        <button class="back-btn" id="back-btn">← <span id="back-text">Back to search</span></button>
        <div class="result-content" id="result-content"></div>
        <p class="disclaimer" id="disclaimer-text"></p>
    </div>

    <script src="search-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
